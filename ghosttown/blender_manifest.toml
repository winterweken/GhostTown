schema_version = "1.0.0"

id = "ghosttown"
version = "0.3.0"
name = "Ghost Town"
tagline = "Site context from open data, built as clean geometry"
maintainer = "winterweken"
type = "add-on"
website = "https://github.com/winterweken/GhostTown"
tags = ["3D View", "Import-Export"]

blender_version_min = "5.2.0"
license = ["SPDX:GPL-3.0-or-later"]
copyright = ["2026 winterweken"]

platforms = ["macos-arm64", "macos-x64", "windows-x64", "linux-x64"]
wheels = [
  "./wheels/shapely-2.1.2-cp313-cp313-macosx_11_0_arm64.whl",
  "./wheels/shapely-2.1.2-cp313-cp313-macosx_10_13_x86_64.whl",
  "./wheels/shapely-2.1.2-cp313-cp313-win_amd64.whl",
  "./wheels/shapely-2.1.2-cp313-cp313-manylinux2014_x86_64.manylinux_2_17_x86_64.whl",
]

[permissions]
network = "Download map, terrain and building data"

[build]
paths_exclude_pattern = ["__pycache__/", "*.pyc", ".DS_Store"]

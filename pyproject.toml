[project]
name = "ghosttown-dev"
version = "0.8.1"
description = "Development environment for the Ghost Town Blender extension"
requires-python = "==3.13.*"
dependencies = []

[dependency-groups]
dev = ["numpy==2.3.4", "shapely==2.1.2", "pillow==11.3.0", "pytest>=8", "pytest-socket>=0.7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/fetch", "tests/revit"]
pythonpath = ["ghosttown", "tests/fetch", "revit/GhostTown.extension/lib"]
addopts = "--disable-socket -q"
